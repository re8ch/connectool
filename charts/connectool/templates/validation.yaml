{{- range $publication := .Values.toolhive.publications }}
  {{- $owners := 0 }}
  {{- range $.Values.codex.plugins }}
    {{- if and (eq .publication $publication.name) .mcpOwner }}{{ $owners = add1 $owners }}{{ end }}
  {{- end }}
  {{- if ne (int $owners) 1 }}{{ fail (printf "publication %q must have exactly one Codex mcpOwner; got %v" $publication.name $owners) }}{{ end }}
{{- end }}
{{- range $plugin := .Values.codex.plugins }}
  {{- $matches := 0 }}
  {{- range $.Values.toolhive.publications }}
    {{- if eq .name $plugin.publication }}{{ $matches = add1 $matches }}{{ end }}
  {{- end }}
  {{- if ne (int $matches) 1 }}{{ fail (printf "Codex plugin %q must reference exactly one ToolHive publication; got %v" $plugin.name $matches) }}{{ end }}
{{- end }}
{{- if .Values.codex.marketplace.publisher.enabled }}
  {{- if not .Values.codex.marketplace.publisher.repository }}{{ fail "codex.marketplace.publisher.repository is required when the publisher is enabled" }}{{ end }}
  {{- if not .Values.codex.marketplace.publisher.secretRef.name }}{{ fail "codex.marketplace.publisher.secretRef.name is required when the publisher is enabled" }}{{ end }}
  {{- if ne .Values.codex.marketplace.source .Values.codex.marketplace.publisher.repository }}{{ fail "codex.marketplace.source must equal codex.marketplace.publisher.repository when the publisher is enabled" }}{{ end }}
{{- end }}
{{- range $plugin := .Values.codex.plugins }}
  {{- if not (semver $plugin.version) }}{{ fail (printf "Codex plugin %q version must be valid semver" $plugin.name) }}{{ end }}
  {{- range $skill := $plugin.skills }}
    {{- if not (hasPrefix "skills/" $skill.path) }}{{ fail (printf "Codex plugin %q skill path must be below skills/" $plugin.name) }}{{ end }}
    {{- if contains ".." $skill.path }}{{ fail (printf "Codex plugin %q skill path must not contain .." $plugin.name) }}{{ end }}
  {{- end }}
{{- end }}
