global:
  issuer: https://identity.example.com
  scopes: [openid, profile, email, groups, offline_access]
dex:
  contract: {enabled: true, namespace: identity-system, configMapName: connectool-oidc-clients}
toolhive:
  namespace: toolhive-system
  placement:
    nodeSelector: {kubernetes.io/os: linux}
  registry:
    enabled: true
    name: approved
    sources:
      - {name: managed-workloads, kubernetes: {namespaces: [toolhive-system]}}
    release: {enabled: false, version: 1.5.0, sourceNamespace: flux-system, values: {}}
  sessionStorage:
    provider: redis
    address: ""
    passwordSecretRef: {name: "", key: password}
  publications:
    - name: platform-tools
      clientId: platform-tools
      resourceUrl: https://tools.example.com/mcp
      group: platform-tools
      createGroup: true
      replicas: 1
      workloads:
        - {name: observe, toolConfigRef: observe-tools}
      outgoingAuth:
        source: inline
        default: {type: discovered}
        backends:
          observe: {type: externalAuthConfigRef, externalAuthConfigRef: {name: internal-backend}}
      operational:
        failureHandling:
          partialFailureMode: best_effort
          healthCheckInterval: 30s
          healthCheckTimeout: 10s
          unhealthyThreshold: 3
          circuitBreaker: {enabled: true, failureThreshold: 5, timeout: 1m}
      authorization:
        groupClaim: groups
        policies: ['permit(principal, action, resource);']
codex:
  marketplace:
    name: example-tools
    displayName: Example Tools
    source: https://github.com/example/codex-plugins.git
  plugins:
    - name: platform-tool
      publication: platform-tools
      category: Productivity
      mcpOwner: true
      skills: [skills/platform/SKILL.md]
