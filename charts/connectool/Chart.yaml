apiVersion: v2
name: connectool
description: ConnecTool packages Dex authentication, ToolHive MCP/Skill distribution, and Codex plugin registration.
type: application
version: 0.2.3
appVersion: "1.0"
kubeVersion: ">=1.30.0-0"
home: https://github.com/among-clusters/connectool
sources: [https://github.com/among-clusters/connectool]
keywords: [connectool, dex, toolhive, mcp, codex, skills, registry]
maintainers:
  - name: ConnecTool maintainers
    url: https://github.com/among-clusters/connectool
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: changed
      description: Default publications to one replica and inherit one global placement contract.
    - kind: added
      description: Render global node selection into every VirtualMCPServer pod template.
    - kind: changed
      description: Sign the public GHCR artifact with GitHub OIDC for Flux verification.
    - kind: added
      description: Dex public PKCE client registration contracts.
    - kind: added
      description: ToolHive OIDC, virtual MCP aggregation, and Registry source contracts.
    - kind: added
      description: Codex marketplace metadata with a single MCP owner and reusable Skill-only plugins.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/among-clusters/connectool
    - name: support
      url: https://github.com/among-clusters/connectool/issues
