apiVersion: v2
name: connectool
description: ConnecTool packages Dex authentication, ToolHive MCP/Skill distribution, and Codex plugin registration.
type: application
version: 0.4.0
appVersion: "1.0"
kubeVersion: ">=1.30.0-0"
home: https://github.com/re8ch/connectool
sources: [https://github.com/re8ch/connectool]
keywords: [connectool, dex, toolhive, mcp, codex, skills, registry]
maintainers:
  - name: ConnecTool maintainers
    url: https://github.com/re8ch/connectool
annotations:
  artifacthub.io/category: ai-machine-learning
  artifacthub.io/license: Apache-2.0
  artifacthub.io/containsSecurityUpdates: "false"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: Preserve external plugin entries while publishing managed marketplace plugins.
    - kind: changed
      description: Publish complete plugin contracts, including generated skills, from one source of truth.
    - kind: security
      description: Require digest-pinned publisher images and validate generated artifacts before push.
    - kind: added
      description: Optional Git-backed Codex marketplace publisher and VirtualMCPServer pod placement.
    - kind: added
      description: Generated Codex MCP startup timeout configuration.
    - kind: changed
      description: Sign the public GHCR artifact with GitHub OIDC for Flux verification.
    - kind: added
      description: Dex public PKCE client registration contracts.
    - kind: added
      description: ToolHive OIDC, virtual MCP aggregation, and Registry source contracts.
    - kind: added
      description: Codex marketplace metadata with a single MCP owner and reusable Skill-only plugins.
  artifacthub.io/links: |
    - name: source
      url: https://github.com/re8ch/connectool
    - name: support
      url: https://github.com/re8ch/connectool/issues
